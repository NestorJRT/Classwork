<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Express test</title>
</head>

<body>
    <% if (locals.error) { %>
        <h3>
            <%= error %>
        </h3>
        <% } %>
            <form action="/greet" method="get">
                Register:
                <input type="text" name="name" id="name" placeholder="Name">
                <input type="submit" value="go next">
            </form>

            <% if (locals.newName) { %>
                <p>Hello, <%= newName %>!</p>
            <% } %>

            <h2>Registered people</h2>
            <ul>
                <% names.forEach((name, index) => { %>
                    <li><a href="/greet/<%= index %>"><%= name %></a></li>
                <% }) %>
            </ul>

            <h2>ToDO List</h2>

            <form action="/task" method="post">
                <input type="text" name="task" placeholder="New task">
                <button type="submit">Add</button>
            </form>
            <ul>
                <% tasks.forEach((task, index) => { %>
                    <li>
                        <%= task %>

                        <form action="/task/<%= index %>/delete" method="post">
                            <button type="submit">Delete</button>
                        </form>

                        <form action="/task/<%= index %>/up" method="post">
                            <button type="submit">↑</button>
                        </form>

                        <form action="/task/<%= index %>/down" method="post">
                            <button type="submit">↓</button>
                        </form>
                    </li>
                <% }) %>
            </ul>

</body>

</html>
